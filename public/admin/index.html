<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Arcfinity — Content Admin</title>
  </head>
  <body>
    <!--
      Sveltia CMS — a fast, modern, free content editor (drop-in compatible with
      Decap/Netlify CMS). It reads ./config.yml and commits changes to your Git repo.

      • Local editing (no login): run `npm run dev`, open http://localhost:4321/admin
        in Chrome/Edge, and choose "Work with Local Repository". It edits the files on
        your computer directly (via the File System Access API) — no server needed.
        (Use /admin without a trailing slash, or /admin/index.html.)

      • Live editing for your team: set up the GitHub backend in config.yml (see the
        notes there). Then staff log in at yoursite.com/admin/ and Publish commits to
        GitHub, which auto-rebuilds and deploys the site.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js"></script>
  </body>
</html>
