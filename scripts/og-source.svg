<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191b21"/>
      <stop offset="1" stop-color="#0f1013"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- architectural line grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
  </g>
  <!-- arc glow -->
  <circle cx="1050" cy="60" r="360" fill="#b4552d" fill-opacity="0.14"/>
  <!-- mark -->
  <g transform="translate(96,150)">
    <path d="M0 96C0 42 22 8 60 8s60 34 60 96" fill="none" stroke="#faf8f5" stroke-width="9" stroke-linecap="round"/>
    <path d="M26 96c0-27 15-44 34-44s34 17 34 44" fill="none" stroke="#b4552d" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="230" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#faf8f5">Arc<tspan fill="#b4552d">finity</tspan></text>
  <!-- headline -->
  <text x="96" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#faf8f5">Building Homes.</text>
  <text x="96" y="500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#faf8f5">Shaping Possibilities.</text>
  <!-- location -->
  <text x="96" y="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#b7b2a8">Construction &amp; Design · Thiruvananthapuram, Kerala</text>
</svg>
